name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install FFmpeg on Ubuntu
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $maxAttempts = 2
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            choco install ffmpeg -y --no-progress
            if (Get-Command ffmpeg -ErrorAction SilentlyContinue) {
              ffmpeg -version
              exit 0
            }
            if ($attempt -lt $maxAttempts) {
              Write-Warning "FFmpeg install attempt $attempt failed; retrying in 15 seconds."
              Start-Sleep -Seconds 15
            }
          }

          Write-Warning "Chocolatey could not provide FFmpeg; using the GitHub release fallback."
          $archive = Join-Path $env:RUNNER_TEMP "ffmpeg-win64.zip"
          $extractDir = Join-Path $env:RUNNER_TEMP "ffmpeg-win64"
          $assetUrl = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n7.1-latest-win64-gpl-shared-7.1.zip"
          Invoke-WebRequest `
            -Uri $assetUrl `
            -OutFile $archive `
            -MaximumRetryCount 3 `
            -RetryIntervalSec 10
          Expand-Archive -Path $archive -DestinationPath $extractDir -Force
          $ffmpeg = Get-ChildItem -Path $extractDir -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          $ffprobe = Get-ChildItem -Path $extractDir -Filter ffprobe.exe -Recurse | Select-Object -First 1
          if (-not $ffmpeg -or -not $ffprobe) {
            throw "The FFmpeg fallback archive did not contain ffmpeg.exe and ffprobe.exe."
          }
          $binDir = $ffmpeg.Directory.FullName
          $binDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:Path = "$binDir;$env:Path"
          ffmpeg -version
          ffprobe -version
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint with ruff
        run: ruff check src tests
      - name: Format check with black
        run: black --check src tests
      - name: Type check source with mypy
        run: mypy
      - name: Run tests with coverage gate
        run: pytest --cov-report=term-missing --cov-report=xml
      - name: Upload coverage
        if: runner.os == 'Linux' && matrix.python-version == '3.13'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  distributions:
    name: Install ${{ matrix.distribution }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        distribution: [wheel, sdist]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install into a clean environment
        shell: bash
        run: |
          python -m venv .dist-venv
          .dist-venv/bin/python -m pip install --upgrade pip
          if [[ "${{ matrix.distribution }}" == "wheel" ]]; then
            .dist-venv/bin/python -m pip install dist/*.whl
          else
            .dist-venv/bin/python -m pip install dist/*.tar.gz
          fi
          .dist-venv/bin/python -c "import narrascape; print(narrascape.__version__)"
          .dist-venv/bin/python -c "from importlib.resources import files; assert files('narrascape').joinpath('workbench_web/index.html').is_file()"
          .dist-venv/bin/narrascape --help

  docker:
    name: Production Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: false
          tags: narrascape:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  browser:
    name: Workbench browser smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Workbench runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[workbench]"
      - name: Build Workbench
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        working-directory: web
        run: npm run test:e2e
